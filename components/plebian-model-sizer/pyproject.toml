[project]
name = "plebian-model-sizer"
version = "0.1.0"
description = "Local development estimates for document-model training and inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "itsmygithubacct", email = "itsmygithubacct@users.noreply.github.com"}]
dependencies = ["plebian-hardware==0.1.0"]

[project.scripts]
plebian-model-sizer = "plebian_model_sizer.cli:main"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.sources]
plebian-hardware = {path = "../plebian-hardware", editable = true}

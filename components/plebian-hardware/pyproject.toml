[project]
name = "plebian-hardware"
version = "0.1.0"
description = "Privacy-safe local hardware observation for Plebian OS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "itsmygithubacct", email = "itsmygithubacct@users.noreply.github.com" },
]
dependencies = []

[project.scripts]
plebian-hardware = "plebian_hardware.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

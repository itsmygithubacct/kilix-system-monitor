[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-system-monitor-contracts"
version = "0.0.0"
description = "Aggregate contract checks for the Kilix system-monitor monorepo"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "itsmygithubacct", email = "itsmygithubacct@users.noreply.github.com" },
]
dependencies = [
  "jsonschema[format]==4.25.1",
  "uv-build==0.12.5",
]

[tool.uv]
package = false

# This root project is the aggregate contract-check umbrella, not a library:
# the distributable components are components/kilix-telemetry and
# components/plebian-hardware, which carry their own uv_build backends and are
# what tools/check_distributions.py builds and inspects. Declaring an empty
# package list stops setuptools auto-discovery from refusing to guess across
# components/, contracts/, integration/ and tools/.
[tool.setuptools]
packages = []
